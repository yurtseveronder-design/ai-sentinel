name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install workspace dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-build-isolation -e packages/sentinel-core
        pip install --no-build-isolation -e packages/prompt-shield
        pip install --no-build-isolation -e packages/api-tester
        pip install --no-build-isolation -e apps/sentinel-ui

    - name: Run tests across workspace
      run: |
        python -c "import api_tester; print('API Tester imported successfully')"
        python -c "from sentinel_core.shield import BioImmuneShield; print('BioImmuneShield loaded successfully')"