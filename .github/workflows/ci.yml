name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        env:
          AI_SENTINEL_API_KEY: test-api-key
        run: python -m pytest -v
      - name: Evaluation harness
        env:
          AI_SENTINEL_API_KEY: test-api-key
        run: python eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-sentinel .
      - name: Container starts and answers /health
        run: |
          docker run -d --name sentinel -p 8000:8000 -e AI_SENTINEL_API_KEY=ci-key ai-sentinel
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs sentinel; exit 1
