name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest
        env:
          AI_SENTINEL_API_KEY: test-api-key
        run: |
          export PYTHONPATH=src
          pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build and check the distribution
        run: pip install build twine && python -m build && twine check dist/*
      - name: The wheel installs and the client imports
        run: |
          pip install dist/*.whl
          python -c "from ai_sentinel.client import SentinelClient; print('client ok')"
          ai-sentinel --help >/dev/null
