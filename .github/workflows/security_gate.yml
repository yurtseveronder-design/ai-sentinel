name: AI-Sentinel Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pydantic sentence-transformers scikit-learn numpy streamlit fastapi starlette
          pip install -e .
          
      - name: Run Test Suite
        run: python -m pytest tests/
        
      - name: Run Integration Tests
        run: python test_integrations.py
        
      - name: Run Empirical Security Benchmark
        run: python benchmark.py