name: AI-Sentinel Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest pydantic fastapi httpx pyyaml

    - name: Run Pytest Suite
      env:
        PYTHONPATH: src
      run: |
        python -m pytest tests/ -v

    - name: Run Integration Verification
      env:
        PYTHONPATH: src
      run: |
        python test_integrations.py

    - name: Run Empirical Security Benchmark
      env:
        PYTHONPATH: src
      run: |
        python benchmark.py