[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ui"
version = "0.1.0"
description = "AI Sentinel RAG and Security UI"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "sentinel-core",
    "prompt-shield-tester",
    "api-tester"
]

[tool.setuptools.packages.find]
where = ["src"]