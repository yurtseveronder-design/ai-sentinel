version: "2.0"
mode: "strict"

token_window_engine:
  window_size: 5
  actions:
    - "reveal your"
    - "show me your"
    - "ignore your"
    - "ignore this"
    - "ignore prior"
    - "forget everything"
    - "output the"
  targets:
    - "password"
    - "api key"
    - "system instructions"
    - "guidelines"
    - "instruction"
    - "directives"
    - "hidden instructions"

legacy_exact_matches:
    - "ignore previous instructions"
    - "disable all safety filters"
    - "reveal system prompt"