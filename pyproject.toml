[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel"
version = "0.1.0"
description = "A lightweight, transparent keyword-filtering and normalization security gateway prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0"
]

[project.scripts]
ai-sentinel = "ai_sentinel.cli:main"