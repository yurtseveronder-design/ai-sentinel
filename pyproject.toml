[project]
name = "ai-sentinel"
version = "0.1.0"
description = "A lightweight, educational input inspection and RAG security proxy prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0; python_version >= '3.10'",
    "scikit-learn>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"