[build-system] 
requires = ["setuptools>=61.0.0"] 
build-backend = "setuptools.build_meta" 
 
[project] 
name = "ai-sentinel" 
version = "0.2.0" 
description = "An organic biological defense shield" 
readme = "README.md" 
requires-python = ">=3.9" 
dependencies = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "pydantic>=2.0.0", "httpx>=0.20.0"] 
 
[tool.setuptools.packages.find] 
where = ["src"] 
