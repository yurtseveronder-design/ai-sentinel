[project]
name = "ai-sentinel"
version = "0.1.0"
description = "A lightweight, educational input inspection and RAG security proxy prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.0.0"
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0; python_version >= '3.10'"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_sentinel = ["core/*.yaml", "*.yaml"]