[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel"
version = "1.2.0"
description = "Enterprise-grade secure routing and evaluation gateway for AI and RAG pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_sentinel = ["*.json", "*.yaml", "*.yml", "*.txt", "config/*", "rules/*"]