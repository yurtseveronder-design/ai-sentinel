[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_sentinel"
version = "1.0.0"
description = "Enterprise AI Sentinel security gateway and evaluation framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "requests>=2.28.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --cov=ai_sentinel --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ai_sentinel"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == '__main__':",
    "raise NotImplementedError"
]

[tool.setuptools.package-data]
ai_sentinel = ["*.yaml"]