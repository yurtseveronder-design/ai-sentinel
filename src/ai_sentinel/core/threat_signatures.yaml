token_window_engine:
  window_size: 5
  actions:
    - "tell me your"
    - "tell me the"
    - "tell"
    - "act as an"
    - "act as a"
    - "act"
    - "disable safety"
    - "disable your"
    - "disable"
    - "ignore"
    - "disregard"
    - "forget"
    - "reveal"
    - "show me your"
    - "print your"
    - "output the"
    - "exfiltrate"
    - "bypass"
    - "override"
    - "imagine"
    - "pretend"
    - "sudo"
  targets:
    - "password"
    - "passwords"
    - "key"
    - "keys"
    - "credentials"
    - "guideline"
    - "guidelines"
    - "directive"
    - "directives"
    - "instruction"
    - "instructions"
    - "system prompt"
    - "hidden instructions"
    - "rules"
    - "constraints"
    - "mode"
    - "guardrail"
    - "guardrails"
    - "filters"
    - "safety filters"

legacy_exact_matches:
